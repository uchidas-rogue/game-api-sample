name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  TF_WORKING_DIR: terraform/environments/dev

permissions:
  id-token: write
  contents: read
  pull-requests: write

# terraform.yml と deploy.yml で同一グループを共有し、インフラ変更と
# アプリデプロイが同時に ECS を触る競合を防ぐ（先に来た方が走り、他方は待機）。
concurrency:
  group: infra-deploy-${{ github.ref }}
  cancel-in-progress: false

# AWS 環境が未構築のあいだは全ジョブをスキップする（リポジトリ変数 INFRA_ENABLED での明示ゲート）。
# 環境が無い状態では OIDC provider と tf_plan / tf_apply ロール自体が存在せず、
# terraform に到達する前の "Configure AWS credentials" で必ず失敗する。放置すると
# 全 PR で赤が常態化し、CI がレビューのシグナルとして機能しなくなるため明示的に止める。
# 有効化: gh variable set INFRA_ENABLED --body true（環境をフル apply した後に実行する）
# 詳細は terraform/ARCHITECTURE.md「【運用ルール】AWS 環境が無い間は terraform / deploy を止める」。
jobs:
  plan:
    name: terraform plan
    if: vars.INFRA_ENABLED == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 検査対象は terraform/ 全体（make tf/fmt と同じ）。TF_WORKING_DIR
      # （environments/dev）に絞ると modules/** が検査されず、モジュール側の整形崩れが
      # そのまま通ってしまう。ローカルとCIで判定を一致させる。
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: false

  apply:
    name: terraform apply (production-apply)
    if: vars.INFRA_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-apply
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false
