name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test (race + coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # buf breaking は origin/main を比較対象にするため、既定の shallow clone
          # （fetch-depth: 1）だと origin/main が fetch されず解決できない。
          # なお actions/checkout はローカルブランチ refs/heads/main を作らないので、
          # 比較元は必ず origin/ 付きで書くこと（make/proto.mk の proto/breaking を参照）。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint は .golangci-version で固定し、ローカルの `make lint` と
      # 同一のコマンド・同一のバージョンで実行する（決定論的検証の原則: ローカルと CI の等価性）。
      # バイナリは毎回ビルドすると遅いため、バージョン文字列をキーにキャッシュする。
      - name: Cache golangci-lint binary
        uses: actions/cache@v4
        with:
          path: bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.golangci-version') }}

      # sqlc も同様にバージョン固定 + キャッシュする。
      # mockgen は go.mod の go.uber.org/mock からバージョンが決まるため専用の
      # キャッシュキーを持たず、setup-go のモジュールキャッシュに乗る。
      - name: Cache sqlc binary
        uses: actions/cache@v4
        with:
          path: bin/sqlc
          key: sqlc-${{ runner.os }}-${{ hashFiles('.sqlc-version') }}

      # buf も同じくバージョン固定 + キャッシュ。protoc プラグインは
      # protoc-gen-go が go.mod の google.golang.org/protobuf から、
      # protoc-gen-go-grpc が .protoc-gen-go-grpc-version から決まるため、
      # 両方をキーに含める。
      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: bin/buf
          key: buf-${{ runner.os }}-${{ hashFiles('.buf-version') }}

      - name: Cache protoc plugins
        uses: actions/cache@v4
        with:
          path: |
            bin/protoc-gen-go
            bin/protoc-gen-go-grpc
          key: protoc-plugins-${{ runner.os }}-${{ hashFiles('go.mod', '.protoc-gen-go-grpc-version') }}

      # 差分駆動（--new-from-rev）ではなく全件スキャンにしている。
      # 差分駆動は CI 時間が問題になる規模で初めて意味を持つが、本リポジトリは全件でも数秒で、
      # 全件のほうが「違反が一件も存在しない」ことを悉皆的に保証できるため。
      # CI 時間が問題になったら差分駆動へ切り替え、その際は .golangci.yml 自体が
      # 変更された PR のみ全件へフォールバックさせること（設定変更は全体に波及するため）。
      # ローカルでの高速確認用に `make lint/diff` を用意してある。
      - name: Lint (golangci-lint)
        run: make lint

      # proto の命名規約。Go のビルドに依存しないので lint と並べて早い段階で落とす。
      - name: Lint protobuf definitions
        run: make proto/lint

      # 指示書（AGENTS.md / docs/** / .claude/**）の SSoT 崩れと実態との乖離を検知する。
      # lint がコードの規約違反を見るのに対し、こちらは「規約そのものが食い違っていないか」を見る。
      # Go のビルドに依存しないので lint の直後に置き、資料だけの PR でも早く落ちるようにする。
      - name: Check instruction docs (SSoT)
        run: make docs/check

      # ポートフォリオサイトの索引（web/data/index.json）の再生成忘れを検知する。
      # 索引は文書から生成する成果物で、文書だけ直すとサイトの回答が古いまま固定される。
      # Pages のデプロイ時にも同じ検査を通すが、PR の時点で気づけるようここでも実行する。
      - name: Check site index is up to date
        run: make site/check

      # サイトのブラウザ側（web/app.js）を jsdom 上でテストする。
      # app.js はブラウザで動くので Go のテストからは触れず、ここが無いと
      # 「レビューと目視でしか担保されていないコード」がリポジトリに残る。
      # とくに「中継へ本文を送らない」ことの担保は、壊れると設計の前提ごと崩れる。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tests/package-lock.json

      - name: Test site client (jsdom)
        run: make site/test

      # DB 生成物（schema.sql / sqlc）の再生成忘れを検知する。
      # migrations を足して db/schema/dump を忘れた場合や、queries を変えて
      # db/sqlc/gen を忘れた場合に落ちる。
      #
      # paths フィルタで deployments/** 変更時のみ実行する案もあるが、
      # sqlc.yaml の変更や生成物の手動編集を取りこぼすため常に実行する。
      # バイナリはキャッシュ済みなので追加コストは sqlc generate の実行時間のみ。
      #
      # mockgen より先に置く: querier.go が古い状態でモックだけ再生成しても
      # 「モックは querier.go と一致している」ため gen/check は通ってしまい、
      # 本当の原因（sqlc の再生成忘れ）が分かりにくくなる。
      - name: Check DB generated code is up to date
        run: make db/gen/check

      # 生成物（mockgen）の再生成忘れを検知する。
      # 実体（interface）を変更したのにモックを再生成していない場合、コンパイルは通っても
      # テストが古いモックを使い続けるため、ここで落とす。
      # mockgen のバージョンは go.mod の go.uber.org/mock から導出されるので、
      # ローカルと CI で同じ生成結果になる。
      - name: Check generated code is up to date
        run: make gen/check

      # proto 生成物の drift。Go 側は再生成 + git diff、C# 側は .proto の
      # FileDescriptorSet ダイジェストの突合で見る（C# は remote plugin を使うため
      # CI では再生成しない。詳細は make/proto.mk のコメント）。
      - name: Check proto generated code is up to date
        run: make proto/gen/check

      # proto の後方互換。フィールド番号の再利用・型変更・削除を wire 互換の観点で検出する。
      # gRPC では .proto 自体がレスポンス契約の正本なので、これが HTTP 側の
      # testdata/contracts/*.json に相当する判定になる。
      - name: Check proto backward compatibility
        run: make proto/breaking

      - name: Test with -race and coverage
        run: make test/race

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo '## Coverage (per function)'
              echo ''
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 層別カバレッジが AGENTS.md §3 の目標を満たすかを判定する。
      # 直前の test/race が生成した coverage.out をそのまま使い、テストを二重実行しない。
      # サマリ出力の後に置いているのは、未達で落ちたときも $GITHUB_STEP_SUMMARY に
      # 数値が残るようにするため。
      - name: Check coverage thresholds
        run: make test/cover/check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
