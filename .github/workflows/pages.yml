name: Pages

# ポートフォリオサイト（web/）を GitHub Pages へ配信する。
#
# 初回だけリポジトリ設定で Settings → Pages → Source を "GitHub Actions" にする手動作業が要る。
# チャット中継（web/worker/）は Cloudflare Workers へ手動デプロイするもので、ここでは配信しない。

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "docs/**"
      - "scripts/sitegen/**"
      - "*.md"
      - "terraform/ARCHITECTURE.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 同時に走らせない（Pages のデプロイは1本ずつ）。進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 索引（web/data/index.json）は文書から生成する成果物。
      # 文書だけ直して再生成を忘れると、サイトの回答が古い文書のまま固定されるのでここで落とす。
      - name: Check site index is up to date
        run: make site/check

      # worker/ はチャット中継のソースで、静的サイトとしては配信しない
      # （node_modules や wrangler.toml を公開してしまわないよう、明示的に除外する）。
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude 'worker' web/ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
